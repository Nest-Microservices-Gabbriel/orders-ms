steps:
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - -c
      - |
        docker build -t southamerica-west1-docker.pkg.dev/tienda-microservicios-448420/image-registry/orders-ms -f dockerfile.prod --platform=linux/amd64 --build-arg ORDERS_DATABASE_URL=$$DATABASE_URL .
    secretEnv: ['DATABASE_URL']

  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'push',
        'southamerica-west1-docker.pkg.dev/tienda-microservicios-448420/image-registry/orders-ms',
      ]

availableSecrets:
  secretManager:
    - versionName: projects/829384349826/secrets/orders_database_url/versions/1
      env: 'DATABASE_URL'

options:
  logging: CLOUD_LOGGING_ONLY # Los registros se almacenarán solo en Cloud Logging
serviceAccount: 'my-service-account@tienda-microservicios-448420.iam.gserviceaccount.com' # Cambia por tu cuenta de servicio personalizada
